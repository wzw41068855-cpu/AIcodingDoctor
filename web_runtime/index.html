<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AICodingDoctor · 代码助手</title><link rel="stylesheet" href="/workbench.css"></head>
<body>
<header><div class="brand">AICodingDoctor <small>V5</small></div><p>读懂代码，逐步解决问题。</p></header>
<nav aria-label="工作模式"><button type="button" id="nav-ask" aria-pressed="true">代码问答</button><button type="button" id="nav-repair" aria-pressed="false">代码修复</button></nav>
<section class="project"><div class="section-heading"><h2>当前项目</h2><span id="mode-hint">只读分析 · 支持连续追问</span></div>
<label for="repository">本地 Python 仓库</label><div class="row"><input id="repository" name="repository" readonly placeholder="选择本机项目文件夹"><button id="pick" type="button">选择文件夹…</button></div><p class="muted">源码在本机读取；模型和检索服务会处理必要的源码片段。</p>
<details id="settings"><summary>模型设置</summary><div class="settings-grid"><label>模型 <input name="model"></label><label>API 地址 <input name="base_url" type="url"></label><label>API Key（仅内存传递）<input id="key" type="password" autocomplete="off"><small id="key-status"></small></label><label>Embedding Key（可选）<input name="embedding_api_key" type="password" autocomplete="off"></label><label>Rerank Key（可选）<input name="rerank_api_key" type="password" autocomplete="off"></label><label>上下文字符上限 <input name="context_chars" type="number" min="4000" max="24000" value="24000"></label><label>最大输出 Token <input name="max_tokens" type="number" min="256" max="16384" value="4096"></label></div></details></section>
<p id="error" role="alert"></p>
<main class="layout"><aside><div class="section-heading"><h2 id="history-title">会话历史</h2><button id="new-chat" type="button">新对话</button></div><div id="history"></div></aside><div class="main-column">
<section id="ask-panel"><div class="section-heading"><div><h1>与代码库对话</h1><p class="muted">询问实现流程、异常原因或函数调用关系。</p></div><button id="chat-cancel" type="button" hidden>停止回答</button></div><div id="chat-status" role="status" aria-live="polite"></div><div id="messages" role="log" aria-label="聊天记录"></div>
<form id="chat-form"><label for="question" class="sr-only">代码问题</label><textarea id="question" required maxlength="2000" placeholder="例如：登录流程是怎么实现的？" rows="3"></textarea><div class="composer-footer"><label><input id="chat-trust" type="checkbox" required>我信任该项目并授权只读分析</label><button id="send" type="submit" class="primary">发送问题</button></div><p id="chat-hint" class="muted">Enter 发送 · Shift + Enter 换行</p></form><details><summary>本轮执行详情</summary><pre id="chat-details"></pre></details></section>
<section id="repair-panel" hidden><h1>代码修复</h1><p class="muted">描述症状或错误，审查修改，再运行测试。</p><form id="form"><input name="mode" type="hidden" value="repair"><label for="repair-request">修复需求</label><textarea id="repair-request" name="request" required maxlength="4000" placeholder="描述预期行为、实际问题和错误信息"></textarea><div class="settings-grid"><label>允许修改的 Python 文件（留空自主定位）<select name="allowed_files" multiple size="6" disabled></select></label><label>授权测试路径<select name="tests" multiple size="4" disabled></select></label></div><label>本地 Docker 测试镜像 <select name="image"><option value="">请选择修复模式后加载</option></select></label><button type="button" id="images">刷新镜像</button><p id="image-status" class="muted"></p><details><summary>执行参数</summary><label>最大修复轮次 <input name="max_iterations" type="number" min="1" max="5" value="3"></label><label>测试超时秒数 <input name="timeout" type="number" min="1" max="300" value="60"></label></details><label><input name="trusted_copy" type="checkbox" required>我信任该仓库，授权隔离修改与所选 Docker 测试</label><button type="submit" class="primary">开始修复</button></form></section>
<section id="repair-detail" hidden><h2 id="title">修复详情</h2><div id="task-status" role="status" aria-live="polite"></div><div id="controls"></div><pre id="approval"></pre><textarea id="feedback" placeholder="拒绝时填写调整意见，或在运行中补充需求"></textarea><div id="buttons"></div><h3>节点执行结果</h3><div id="node-results"></div><details><summary>任务汇总与诊断</summary><pre id="result"></pre></details><h3>Git Diff（隔离工作区）</h3><p id="apply-status"></p><div id="apply-controls"></div><pre id="diff"></pre></section>
</div></main><script>const token='__TOKEN__';</script><script src="/workbench.js"></script><script src="/chat.js"></script><script src="/workspace.js"></script></body></html>
