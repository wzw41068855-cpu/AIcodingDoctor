<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AICodingDoctor 本地工作台</title>
<style>body{font:16px system-ui;background:#f3f5f8;color:#182332;margin:24px auto;max-width:1100px}section{background:white;padding:22px;margin:16px 0;border-radius:12px}input,textarea,select{padding:8px;box-sizing:border-box;max-width:100%}textarea{width:100%;height:90px}label{display:inline-block;margin:8px}button{padding:9px 16px;margin:6px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2f6;padding:16px}#history button{display:block}.spinner{display:inline-block;width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}#task-status{padding:12px;background:#edf3ff;border-radius:8px;font-weight:600}.node-card{border:1px solid #d9e1eb;border-radius:8px;margin:12px 0;padding:12px}.node-card h4{margin:0 0 8px}</style>
<h1>AICodingDoctor 本地工作台</h1><p>可信 Git 仓库 · 独立工作树 · 审批后执行 · Docker 测试</p>
<section><h2>新建任务</h2><form id="form">
<label>本地 Python 仓库 <input name="repository" required readonly size="65" placeholder="点击选择文件夹"></label><button id="pick" type="button">选择文件夹…</button><p>选择本机仓库，不上传源码。请选择 Git 仓库根目录。</p>
<label>功能 <select name="mode"><option value="repair">修改代码 / 修复 Bug</option><option value="ask">只读代码问答</option></select></label>
<textarea name="request" required placeholder="请输入问题或修复需求"></textarea>
<label>允许修改的 Python 文件（可多选，最多 8 项）<select name="allowed_files" multiple required size="6" disabled></select></label>
<label>测试路径（可多选）<select name="tests" multiple required size="4" disabled></select></label><label>本地 Docker 测试镜像 <select name="image" required><option value="">正在加载镜像…</option></select></label><button type="button" id="images">刷新镜像</button><p id="image-status"></p>
<details><summary>模型及执行参数</summary><label>模型 <input name="model"></label><label>API 地址 <input name="base_url" type="url"></label><label>API Key（仅内存传递）<input id="key" type="password" autocomplete="off" placeholder="输入 API Key"><small id="key-status"></small></label><label>上下文字符上限 <input name="context_chars" type="number" min="4000" max="24000" value="24000"></label><label>最大输出 Token <input name="max_tokens" type="number" min="256" max="16384" value="4096"></label><label>最大修复轮次 <input name="max_iterations" type="number" min="1" max="5" value="3"></label><label>测试超时秒数 <input name="timeout" type="number" min="1" max="300" value="60"></label></details>
<label><input name="trusted_copy" type="checkbox" required>我信任该仓库，授权创建工作树、按文件白名单修改和固定 Docker 测试</label><button>提交任务</button></form></section>
<section><h2>任务历史</h2><div id="history"></div></section><section><h2 id="title">任务详情</h2><div id="task-status" role="status" aria-live="polite"></div><div id="controls"></div><pre id="approval"></pre><textarea id="feedback" placeholder="拒绝计划时填写修改意见，可重新规划"></textarea><div id="buttons"></div><h3>节点执行结果</h3><div id="node-results"></div><h3>任务汇总与诊断</h3><pre id="result"></pre><h3>Git Diff（隔离工作区）</h3><p id="apply-status"></p><div id="apply-controls"></div><pre id="diff"></pre></section><p id="error" role="alert"></p>
<script>
const token='__TOKEN__';let current=localStorage.getItem('aicdTask'),source;
async function api(url,body){const r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Local-Token':token},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.json()}
function button(parent,label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>fn().catch(showError);parent.append(b)}
function showError(e){document.querySelector('#error').textContent='❌ '+e.message}
function statusLabel(status){return {queued:'⏳ 排队中',running:'运行中',waiting:'⏸️ 等待审批',paused:'⏸️ 已暂停',cancelling:'⏳ 正在取消',cancelled:'⏹️ 已取消',success:'✅ 隔离工作区修复完成',failed:'❌ 修复失败',blocked:'❌ 执行受阻'}[status]||status}
function renderStatus(t){const el=document.querySelector('#task-status');el.replaceChildren();if(['running','queued','cancelling'].includes(t.status)){const spinner=document.createElement('span');spinner.className='spinner';spinner.setAttribute('aria-hidden','true');el.append(spinner)}const kind=t.approval?.kind;const node=t.current_node||({plan:'PlanApproval',edit:'EditApproval',test:'TestApproval'}[kind])||'任务初始化';el.append(document.createTextNode(statusLabel(t.status)+' · 当前节点：'+node+(t.pause_requested?' · ⏸️ 已请求暂停，等待下一审批点':'')));}
function renderNodes(t){const el=document.querySelector('#node-results');el.replaceChildren();const results=t.node_results||{};if(!Object.keys(results).length&&t.result){const r=t.result;if(r.plan)results.Planner={plan:r.plan};if(r.changes?.length)results.Coder={iteration:r.iteration,changes:r.changes};if(r.test_result)results.Tester={test_result:r.test_result};if(r.review_result)results.Reviewer={review_result:r.review_result};if(r.final_report)results.Finalizer={final_report:r.final_report}}for(const [name,result] of Object.entries(results)){const card=document.createElement('div');card.className='node-card';const heading=document.createElement('h4');heading.textContent=name+' · 节点结果'+(result?.iteration?' · 第 '+result.iteration+' 轮':'');const pre=document.createElement('pre');pre.textContent=JSON.stringify(result,null,2);card.append(heading,pre);el.append(card)}if(!el.childNodes.length)el.textContent='尚无节点结果';}
function renderApply(t){const controls=document.querySelector('#apply-controls'),status=document.querySelector('#apply-status');controls.replaceChildren();if(t.application_status==='applied'){status.textContent='✅ 已应用到原仓库：'+t.applied_repository+'（尚未提交 Git）';return}if(['applying','uncertain'].includes(t.application_status)){status.textContent='⚠️ 应用结果尚未确认，请人工检查原仓库';return}if(t.status==='success'&&t.options?.mode==='repair'){status.textContent='修复保存在隔离工作区，尚未应用到原仓库。请审查下方 Diff。';button(controls,'应用修改到原仓库',async()=>{const taskId=t.id;const preview=await api('/api/tasks/'+taskId+'/apply-preview');if(preview.applied){await refresh();return}if(!confirm('确认将以下修改应用到原仓库？\n'+preview.repository+'\n文件：\n'+preview.files.join('\n')+'\n\n不会自动创建 Git 提交。'))return;await api('/api/tasks/'+taskId+'/apply',{confirm:true});await refresh()})}else{status.textContent='仅通过验收的修复任务可以应用修改。'}}
async function history(){const el=document.querySelector('#history');el.replaceChildren();for(const t of await api('/api/tasks'))button(el,t.id+' · '+statusLabel(t.status),()=>select(t.id))}
async function refresh(){if(!current)return;const t=await api('/api/tasks/'+current);document.querySelector('#title').textContent=t.id+' · '+statusLabel(t.status);renderStatus(t);renderNodes(t);renderApply(t);document.querySelector('#result').textContent=JSON.stringify(t.error?{error:t.error,diagnostic_path:t.diagnostic_path,diagnostics:t.diagnostics,result:t.result}:t.result||t.answer||t.progress||{},null,2);document.querySelector('#diff').textContent=(await api('/api/tasks/'+current+'/diff')).diff;document.querySelector('#approval').textContent=JSON.stringify(t.approval||{},null,2);const buttons=document.querySelector('#buttons');buttons.replaceChildren();if(t.status==='waiting')for(const approve of [true,false])button(buttons,approve?'批准':'拒绝',async()=>{await api('/api/tasks/'+current+'/approve',{approval_id:t.approval.id,approve,feedback:document.querySelector('#feedback').value,api_key:document.querySelector('#key').value});await refresh()});const controls=document.querySelector('#controls');controls.replaceChildren();for(const action of ['pause','resume','cancel'])button(controls,{pause:'暂停（审批点）',resume:'恢复审批',cancel:'取消任务'}[action],async()=>{await api('/api/tasks/'+current+'/'+action,{});await refresh()});await history()}
async function select(id){current=id;localStorage.setItem('aicdTask',id);if(source)source.close();source=new EventSource('/api/tasks/'+id+'/events');source.onmessage=()=>refresh().catch(showError);await refresh()}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));for(const k of ['tests','allowed_files'])data[k]=new FormData(e.target).getAll(k);if(data.allowed_files.length>8||data.tests.length>8)throw Error('源码和测试路径分别最多选择 8 项');for(const k of ['max_tokens','max_iterations','timeout','context_chars'])data[k]=Number(data[k]);if(data.mode==='repair'&&!data.image)throw Error('请先准备并选择本地 Docker 测试镜像');data.trusted_copy=true;data.api_key=document.querySelector('#key').value;const t=await api('/api/tasks',data);await select(t.task_id)}catch(e){showError(e)}};
function fillOptions(name,items,placeholder){const el=document.querySelector('[name="'+name+'"]');el.replaceChildren();if(!items.length){const option=new Option(placeholder,'');option.disabled=true;el.add(option)}for(const item of items)el.add(new Option(item,item));el.disabled=!items.length}
async function loadImages(){const data=await api('/api/options/images',{});fillOptions('image',data.images,'没有可用本地镜像');document.querySelector('#image-status').textContent=data.error||(data.images.length?'请选择已安装 pytest 和项目依赖的镜像':'本地没有镜像，请准备测试镜像后刷新');if(data.images.length)document.querySelector('[name="image"]').value=data.images[0]}
document.querySelector('#images').onclick=()=>loadImages().catch(showError);
document.querySelector('#pick').onclick=async()=>{const b=document.querySelector('#pick');b.disabled=true;b.textContent='请在系统对话框中选择…';try{const data=await api('/api/repositories/select',{});if(!data.cancelled){document.querySelector('[name="repository"]').value=data.repository;fillOptions('allowed_files',data.allowed_files,'没有可修改的业务 Python 文件');fillOptions('tests',data.tests,'没有可用的测试路径');const tests=document.querySelector('[name="tests"]');if(data.tests.length)tests.value=data.tests.includes('tests')?'tests':data.tests[0];document.querySelector('#error').textContent=data.allowed_files.length&&data.tests.length?'':'仓库缺少可修改源码或测试，请检查仓库内容';}}catch(e){showError(e)}finally{b.disabled=false;b.textContent='选择文件夹…'}};
async function loadDefaults(){const data=await api('/api/defaults');for(const name of ['model','base_url','max_tokens','context_chars','max_iterations','timeout'])document.querySelector('[name="'+name+'"]').value=data[name];document.querySelector('#key').placeholder=data.api_key_configured?'********（已配置，留空沿用）':'输入 API Key';document.querySelector('#key-status').textContent=data.api_key_configured?' 已配置；输入新值可覆盖':' 未检测到环境凭据'}
loadDefaults().catch(showError);loadImages().catch(showError);history().catch(showError);if(current)select(current).catch(showError);
</script></html>
